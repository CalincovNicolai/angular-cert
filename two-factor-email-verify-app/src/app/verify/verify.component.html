<section class="verify-shell">
  <form class="verify-card" #verifyForm="ngForm">
    <p class="eyebrow">Two-factor authentication</p>
    <h1>Verify your email code</h1>
    <p class="description">
      Paste the 6-digit code from your email to continue.
    </p>

    <div class="code-grid">
      <input
        #digitInput
        class="digit-input"
        [class.filled]="digits[0]"
        type="text"
        inputmode="numeric"
        pattern="[0-9]*"
        min="0"
        max="9"
        maxlength="1"
        required
        autocomplete="one-time-code"
        name="digit0"
        [ngModel]="digits[0]"
        (ngModelChange)="onDigitChange(0, $event)"
        (paste)="onPaste($event, 0)"
        (keydown)="onKeyDown($event, 0)"
        (focus)="selectInput($event)"
        autofocus
      />

      <input
        #digitInput
        class="digit-input"
        [class.filled]="digits[1]"
        type="text"
        inputmode="numeric"
        pattern="[0-9]*"
        min="0"
        max="9"
        maxlength="1"
        required
        name="digit1"
        [ngModel]="digits[1]"
        (ngModelChange)="onDigitChange(1, $event)"
        (paste)="onPaste($event, 1)"
        (keydown)="onKeyDown($event, 1)"
        (focus)="selectInput($event)"
      />

      <input
        #digitInput
        class="digit-input"
        [class.filled]="digits[2]"
        type="text"
        inputmode="numeric"
        pattern="[0-9]*"
        min="0"
        max="9"
        maxlength="1"
        required
        name="digit2"
        [ngModel]="digits[2]"
        (ngModelChange)="onDigitChange(2, $event)"
        (paste)="onPaste($event, 2)"
        (keydown)="onKeyDown($event, 2)"
        (focus)="selectInput($event)"
      />

      <input
        #digitInput
        class="digit-input"
        [class.filled]="digits[3]"
        type="text"
        inputmode="numeric"
        pattern="[0-9]*"
        min="0"
        max="9"
        maxlength="1"
        required
        name="digit3"
        [ngModel]="digits[3]"
        (ngModelChange)="onDigitChange(3, $event)"
        (paste)="onPaste($event, 3)"
        (keydown)="onKeyDown($event, 3)"
        (focus)="selectInput($event)"
      />

      <input
        #digitInput
        class="digit-input"
        [class.filled]="digits[4]"
        type="text"
        inputmode="numeric"
        pattern="[0-9]*"
        min="0"
        max="9"
        maxlength="1"
        required
        name="digit4"
        [ngModel]="digits[4]"
        (ngModelChange)="onDigitChange(4, $event)"
        (paste)="onPaste($event, 4)"
        (keydown)="onKeyDown($event, 4)"
        (focus)="selectInput($event)"
      />

      <input
        #digitInput
        class="digit-input"
        [class.filled]="digits[5]"
        type="text"
        inputmode="numeric"
        pattern="[0-9]*"
        min="0"
        max="9"
        maxlength="1"
        required
        name="digit5"
        [ngModel]="digits[5]"
        (ngModelChange)="onDigitChange(5, $event)"
        (paste)="onPaste($event, 5)"
        (keydown)="onKeyDown($event, 5)"
        (focus)="selectInput($event)"
      />
    </div>

    <button
      class="verify-button"
      type="submit"
      [disabled]="verifyForm.invalid"
    >
      Verify
    </button>
  </form>
</section>
